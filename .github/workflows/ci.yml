name: Test and container build

on:
  push:
    branches: [codex/repo-health-fixes]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEATHER_PROVIDER: mock
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Install test dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # CPU wheels avoid downloading CUDA libraries on a CPU-only runner.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3' 2>&1 | tee artifacts/torch-install.log
          python -m pip install -r backend/requirements.txt -r backend/requirements-ci.txt 2>&1 | tee artifacts/backend-install.log

      - name: Run all backend tests (current baseline 396)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -ra --junitxml=../artifacts/pytest.xml 2>&1 | tee ../artifacts/pytest.log

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee ../artifacts/frontend-install.log

      - name: Check frontend types
        working-directory: frontend
        run: |
          set -euo pipefail
          npx tsc -b 2>&1 | tee ../artifacts/frontend-types.log

      - name: Build production frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../artifacts/frontend-build.log

      # Docker is preinstalled on ubuntu-latest; no daemon installation or login.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend base image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: INSTALL_FORECAST=false
          push: false
          tags: pv-storage-backend:ci-base
          cache-from: type=gha,scope=backend-base
          cache-to: type=gha,mode=min,scope=backend-base

      - name: Build backend forecasting image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: INSTALL_FORECAST=true
          push: false
          tags: pv-storage-backend:ci-forecast
          cache-from: type=gha,scope=backend-forecast
          cache-to: type=gha,mode=min,scope=backend-forecast

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: pv-storage-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=min,scope=frontend

      # Diagnostics are retained on failure too; no failed check is ignored.
      # Buildx prints build logs and publishes a build summary/record to this run.
      - name: Upload test and frontend build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Write verification summary
        if: always()
        env:
          VERIFY_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Verification: ${VERIFY_STATUS}"
            echo 'Backend: full pytest suite with JUnit XML (current local baseline: 396 passed).'
            echo 'Frontend: npm ci, tsc -b, production build.'
            echo 'Containers: base backend, forecasting backend and frontend; push=false.'
            echo 'See step logs, verification-reports and the Buildx build records for actual results.'
          } >> "$GITHUB_STEP_SUMMARY"
