# ============================================================
#  江苏省工商业分时电价（已核实版）
#
#  政策依据
#    《关于优化工商业分时电价结构促进新能源消纳降低企业用电成本
#      支持经济社会发展的通知》 苏发改价格发〔2025〕426号
#      2025-04-30 印发，2025-06-01 起施行
#    国网江苏省电力有限公司《关于 2026 年 8 月代理购电工商业用户电价的公告》
#
#  ⚠️ 两种价格都会变，改动时只需重算 energy_price，时段划分不变：
#     · 代理购电价格   逐月调整（本文取 2026-08）
#     · 输配电价       按监管周期调整
#     · 政府性基金及附加 / 系统运行费用  随政策与月度公告调整
#
#  ⚠️ 2026-03-01 起，国家发改委〔2025〕1656号要求「直接参与市场交易的
#     经营主体不再人为规定分时电价水平和时段」。江苏的实施细则截至 2026-10
#     仍在征求意见阶段。**未直接入市的代理购电用户继续执行 426 号文**，
#     本文件即适用于后者。
# ============================================================

province: 江苏省
voltage_level: 1-10kV
effective_date: "2026-08-01"
source: "苏发改价格发〔2025〕426号 + 国网江苏 2026-08 代理购电公告"

# ------------------------------------------------------------
# 固定部分（元/kWh）—— 不随峰谷时段浮动
#
# 到户电价 = energy_price(浮动) + 本项
#
# 这段之所以叫 transmission_and_fund 是沿用字段名，
# 实际含义是「除电能量外的全部固定加价」：
#   上网环节线损费用折价 + 电度输配电价 + 系统运行费用折价 + 政府性基金及附加
#
# 反推验证（1-10kV 两部制）：
#   平段 0.3832 + 0.2319 = 0.6151  ← 与公告 0.6151 一致
#   高峰 0.3832×1.80 + 0.2319 = 0.9217  ← 一致
#   低谷 0.3832×0.35 + 0.2319 = 0.3660  ← 一致
#   尖峰 0.3832×1.80×1.20 + 0.2319 = 1.0597  ← 一致
# ------------------------------------------------------------
transmission_and_fund:
  1-10kV: 0.2319
  35kV: 0.2069
  110kV: 0.1809
  220kV及以上: 0.1539

fixed_components_2026_08:
  上网环节线损费用折价: 0.0115
  电度输配电价_1-10kV: 0.1298
  系统运行费用折价: 0.0612
  政府性基金及附加: 0.0294

# ------------------------------------------------------------
# 浮动的基准与比例
# ------------------------------------------------------------
purchase_price: 0.3832      # 代理工商业购电价格（元/kWh，2026-08），浮动基准
floating_ratio:
  peak_up: 0.80             # 两部制用户：高峰在基础上上浮 80%
  valley_down: 0.65         # 低谷下浮 65%
  sharp_up_on_peak: 0.20    # 315 kVA 及以上工业：尖峰在峰段基础上再上浮 20%
  note: "单一制 100kVA 及以上为峰+70%，100kVA 以下为峰+60%；谷段一律 −65%"

# ------------------------------------------------------------
# energy_price = 电能量价格（不含固定部分）
#
#   tier = purchase_price × 系数
#     flat    0.3832 × 1.00        = 0.3832   → 到户 0.6151
#     peak    0.3832 × 1.80        = 0.6898   → 到户 0.9217
#     valley  0.3832 × 0.35        = 0.1341   → 到户 0.3660
#     sharp   0.3832 × 1.80 × 1.20 = 0.8277   → 到户 1.0597
#
# 基础表 = 春、秋两季（3-5 月、9-11 月），其余月份由 seasonal_overrides 覆盖。
# ------------------------------------------------------------
energy_price:
  sharp:
    price: 0.8277
    hours: []                      # 春秋季无尖峰，由季节覆盖补齐
  peak:
    price: 0.6898
    hours: ["15:00-22:00"]
  flat:
    price: 0.3832
    hours: ["06:00-10:00", "14:00-15:00", "22:00-02:00"]
  valley:
    price: 0.1341
    hours: ["02:00-06:00", "10:00-14:00"]

# ------------------------------------------------------------
# 季节覆盖
#
# ⚠️ 426 号文的分组是「夏(6-8月)、冬(12月-次年2月)」，不是常见的 7-8 / 12-1。
#    且尖峰另有自己的生效月份（7-8 月、12 月-次年 1 月），故拆成四段，
#    否则 6 月和 2 月会被错误地加上尖峰。
#
# 夏冬两季时段：高峰 14:00-22:00｜平时 06:00-11:00、13:00-14:00、22:00-24:00
#               低谷 00:00-06:00、11:00-13:00
# 尖峰：7-8 月 14:00-15:00、19:30-21:30；12 月-次年 1 月 18:00-20:00
#
# ⭐ 注意 11:00-13:00（夏冬）与 10:00-14:00（春秋）这两个「午间谷段」——
#    正好压在光伏大发时段上，是江苏 426 号文最核心的变化。
# ------------------------------------------------------------
seasonal_overrides:
  summer_peak:                    # 7、8 月：有尖峰
    months: [7, 8]
    peak:
      hours: ["14:00-22:00"]
    flat:
      hours: ["06:00-11:00", "13:00-14:00", "22:00-24:00"]
    valley:
      hours: ["00:00-06:00", "11:00-13:00"]
    sharp:
      hours: ["14:00-15:00", "19:30-21:30"]

  summer_june:                    # 6 月：夏冬时段，但无尖峰
    months: [6]
    peak:
      hours: ["14:00-22:00"]
    flat:
      hours: ["06:00-11:00", "13:00-14:00", "22:00-24:00"]
    valley:
      hours: ["00:00-06:00", "11:00-13:00"]
    sharp:
      hours: []

  winter_peak:                    # 12 月、次年 1 月：有尖峰
    months: [12, 1]
    peak:
      hours: ["14:00-22:00"]
    flat:
      hours: ["06:00-11:00", "13:00-14:00", "22:00-24:00"]
    valley:
      hours: ["00:00-06:00", "11:00-13:00"]
    sharp:
      hours: ["18:00-20:00"]

  winter_february:                # 2 月：冬时段，但无尖峰
    months: [2]
    peak:
      hours: ["14:00-22:00"]
    flat:
      hours: ["06:00-11:00", "13:00-14:00", "22:00-24:00"]
    valley:
      hours: ["00:00-06:00", "11:00-13:00"]
    sharp:
      hours: []

# ------------------------------------------------------------
# 两部制基本电费
#
# 按月最大需量计费，或按变压器容量计费，**用户可逐月选择**。
# 负荷率低（<45%）或有储能削峰能力时，按需量计费更优——
# 「选哪种方式」本身就是一个优化变量，不要写死。
# ------------------------------------------------------------
demand_charge:
  price_per_kw_month: 51.2          # 1-10kV 两部制（35kV 48｜110kV 44.8｜220kV+ 41.6）
  capacity_price_per_kva_month: 32  # 1-10kV（35kV 30｜110kV 28｜220kV+ 26）
  billing_basis: max_monthly_demand
  selectable: true
  note: "数值随监管周期调整；需量电价直接影响储能削峰收益，改动前先核对公告"

# ------------------------------------------------------------
# 时段解析规则
# ------------------------------------------------------------
time_parsing:
  note: >
    时段以半小时为最小粒度。跨零点时段（如 22:00-02:00）在解析器中
    按 start > end 处理。尖峰区间包含在高峰区间内，查找优先级为
    尖峰 > 高峰 > 平段 > 低谷。

# ------------------------------------------------------------
# 核实要点（改价时逐条对照省发改委文件）
# ------------------------------------------------------------
verification_checklist:
  - "时段划分是否仍为夏冬 14:00-22:00 高峰 / 春秋 15:00-22:00 高峰"
  - "浮动比例是否仍为两部制峰 +80%、谷 −65%"
  - "尖峰适用容量门槛是否仍为 315 kVA 及以上工业"
  - "代理购电价格（本文 0.3832）是否已换成目标月份"
  - "需量电价（本文 51.2）是否已换成目标月份"
  - "江苏市场化细则是否已正式落地（会改变已入市用户的适用规则）"
