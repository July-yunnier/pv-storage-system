# ============================================================
#  江苏省工商业分时电价模板（示例）
#
#  ⚠️⚠️ 重要：以下数值与时段划分均为【结构示例】，
#      不代表江苏省现行政策的真实数值。
#      各省、各电压等级、每年都会调整，个别月份还有季节性时段。
#
#      上线前必须替换为：省级发改委最新目录电价文件
#      （搜索关键词：<省名> 工商业 分时电价 目录电价 通知）
# ============================================================

province: 江苏省
voltage_level: 1-10kV
effective_date: "2026-01-01"        # 政策生效日，改价时更新
source: "示例占位 —— 需替换为省发改委正式文件"

# ------------------------------------------------------------
# 输配电价 + 政府性基金及附加（按电压等级）
#
# 这部分是「固定部分」：参与现货市场后不随市场价浮动，
# 到户电价 = 电能量价格 + 本项。
# ------------------------------------------------------------
transmission_and_fund:
  1-10kV: 0.21
  20-35kV: 0.19
  35-110kV: 0.16
  note: "数值为示例占位，需按最新输配电价文件核实"

# ------------------------------------------------------------
# 目录电价（仅「电能量价格」部分，不含输配电价与政府性基金）
# price 单位：元/kWh
# ------------------------------------------------------------
energy_price:
  sharp:                        # 尖峰
    price: 1.25
    hours: ["17:00-19:00"]
  peak:                         # 高峰
    price: 0.95
    hours: ["13:00-17:00", "19:00-20:00"]
  flat:                         # 平段
    price: 0.65
    hours: ["07:00-13:00", "20:00-23:00"]
  valley:                       # 低谷
    price: 0.35
    hours: ["23:00-07:00"]

# ------------------------------------------------------------
# 季节性调整（部分省份夏季尖峰时段会延长，按需启用）
# 启用方式：在 tariff 配置里指定 season_override
# ------------------------------------------------------------
seasonal_overrides:
  summer:                       # 7-8 月
    months: [7, 8]
    sharp:
      hours: ["13:00-15:00", "17:00-19:00"]
  winter:                       # 12-1 月
    months: [12, 1]
    sharp:
      hours: ["17:00-19:00"]

# ------------------------------------------------------------
# 需量电费（两部制电价的基本电费部分）
# ------------------------------------------------------------
demand_charge:
  price_per_kw_month: 38
  billing_basis: max_monthly_demand
  note: "按最大需量计费时，储能削峰可直接降低此项支出"

# ------------------------------------------------------------
# 时段划分的解析规则说明
# ------------------------------------------------------------
time_parsing:
  note: >
    时段以半小时为最小粒度解析。跨零点的时段（如 23:00-07:00）
    需拆成 [23:00-24:00] + [00:00-07:00] 两段处理。
    18:30 这类非整点边界，按「左闭右开」规则归属到前一段。
